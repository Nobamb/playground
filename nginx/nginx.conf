# ./nginx/nginx.conf
# Nginx의 주요 설정을 담당합니다.

# 실행 유저 및 프로세스 수 설정
user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 업스트림(upstream) 서버 그룹 정의
    # Docker Compose 내부 네트워크에서는 서비스 이름을 호스트 이름으로 사용할 수 있습니다.
    
    # 프론트엔드 서버 (Vite)
    upstream frontend {
        # 'frontend'는 docker-compose.yml에 정의된 서비스 이름입니다.
        server frontend:5173;
    }

    # 백엔드 서버 (FastAPI)
    upstream backend {
        # 'backend'는 docker-compose.yml에 정의된 서비스 이름입니다.
        server backend:8000;
    }

    # 가상 서버 설정
    server {
        listen 80; # 80번 포트에서 요청을 받습니다.

        # 루트 경로 ('/')로 오는 모든 요청은 프론트엔드 서버로 전달합니다.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # **헷갈리기 쉬운 부분**: Vite의 HMR(Hot Module Replacement)은 WebSocket을 사용합니다.
            # WebSocket 연결을 프론트엔드 서버로 전달하기 위한 설정입니다.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # '/api' 경로로 오는 모든 요청은 백엔드 서버로 전달합니다.
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
