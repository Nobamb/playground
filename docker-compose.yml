# docker-compose.yml
# 각 서비스(컨테이너)의 구성과 상호작용을 정의하는 파일입니다.
# 'docker-compose up' 명령어로 이 파일에 정의된 모든 서비스를 한 번에 실행할 수 있습니다.

version: "3.8"

services:
  # Nginx 리버스 프록시 서버
  nginx:
    build: ./nginx  # './nginx' 폴더에 있는 Dockerfile을 사용하여 이미지를 빌드합니다.
    ports:
      - "80:80"  # 로컬 컴퓨터의 80번 포트를 컨테이너의 80번 포트와 연결합니다.
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # Frontend (React) 서비스
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app # 로컬의 frontend 폴더를 컨테ainer의 /app 폴더와 동기화합니다.
      - /app/node_modules # node_modules는 동기화에서 제외하여 속도를 향상시킵니다.
    networks:
      - app-network

  # Backend (FastAPI) 서비스
  backend:
    build: ./backend
    volumes:
      - ./backend:/app  # 로컬 backend 폴더를 컨테이너 /app 폴더와 동기화합니다.
      - ./storage:/app/storage # 로컬 storage 폴더를 컨테이너 /app/storage 폴더에 연결하여 파일 공유
    env_file:
      - ./backend/.env # './backend/.env' 파일에 정의된 환경변수들을 사용합니다.
    depends_on:
      - db
    networks:
      - app-network

  # Database (PostgreSQL) 서비스
  db:
    image: postgres:13-alpine # 공식 PostgreSQL 13 이미지를 사용합니다.
    volumes:
      - postgres_data:/var/lib/postgresql/data/ # DB 데이터를 영구적으로 저장하기 위한 볼륨입니다.
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app_db
    networks:
      - app-network

# 모든 서비스가 속할 네트워크를 정의합니다.
networks:
  app-network:
    driver: bridge

# PostgreSQL 데이터를 저장할 볼륨을 정의합니다.
volumes:
  postgres_data:
